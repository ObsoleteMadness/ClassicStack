[AFP]
server_name = 'ClassicStack'
zone = '*'
transports = ['ddp']
login_message = 'Welcome to ClassicStack - enjoy your stay.'

[EtherDFS]
enabled = true
capture = 'etherdfs.pcap'

[IPXGW]
enabled = true
bindings = ['ClassicStackIPXGW:EtherTalk Network']
ipx_frame_type = "ethernet_ii"
ipx_network = 0x03

[MacIP]
enabled = true
mode = 'nat'
zone = 'EtherTalk Network'
gateway_ip = '192.168.100.1'
network = '192.168.100.0'
nameserver = '8.8.8.8'
broadcast = '192.168.100.255'
subnet_mask = '255.255.255.0'
interface = 'br-lan'
default_gateway = '192.168.0.1'

# TashTalk — a PIC-based RS422 LocalTalk-to-serial adaptor. The port owns its own
# serial line: set device/baud here (no serial interface).
[[tashtalk]]
enabled = true
device = "COM7"
baud = 1000000
seed_network = 2
seed_zone = "TashTalk Network"
capture = 'tashtalk.pcap'

[NetBIOS]
transports = ['netbeui', 'ipx']

[Netboot]
enabled = true
payload = 'C:\Users\pgodw\OneDrive\Documents\GitHub\NetBoot\ChainLoader.diag.bin'
block_size = 256
disk = 'C:\Users\pgodw\OneDrive\Documents\GitHub\NetBoot\A608.dsk'
pace_ms = 2
chain_pace_ms = 10
name = '0000'
zone = '*'

[SMB]
transports = ['netbeui', 'ipx', 'nbt']

[adminauth]
user = 'admin'
salt = '0023bfac16cdcddbbcbcae1779d9fa18'
hash = 'ff05b74ea38440edef8ea1d7034f118b6fe706bce44ef37e1a9c0c1728b2a74c'

[[afpvolumes]]
name = 'Test Volume'
fs_type = 'local_fs'
path = 'C:\mac'
size_limit = 50000

[[etherdfsdrives]]
name = 'C'
fs_type = 'local_fs'
path = 'c:\mac\food'

[[ethertalk]]
iface = 'br-lan'
enabled = true
mac = 'DE:AD:BE:EF:CA:FE'
seed_network = 3
seed_network_end = 5
seed_zone = 'EtherTalk Network'
capture = 'ethertalk.pcap'

[identity]
hostname = 'classicstack'
workgroup = 'WORKGROUP'
description = 'ClassicStack file server'

[[interface]]
name = 'br-lan'
kind = 'bridge'
default = true
backend = 'pcap'
hw_address = 'DE:AD:BE:EF:CA:FE'
device = '\Device\NPF_{B7D4E073-2185-4912-BBE8-3948C6636D02}'

[[ipx]]
iface = 'br-lan'
enabled = true
capture = 'ipx.pcap'

[logging]
level = 'debug'

[[ltoudp]]
enabled = true
seed_network = 1
seed_network_end = 1
seed_zone = 'LToUDP Network'
capture = 'ltoudp-netboot.pcap'
pace_ms = 30

[[ncpvolumes]]
name = 'Foo'
fs_type = 'local_fs'
path = 'c:\mac\food'

[[netbeui]]
iface = 'br-lan'
enabled = true
capture = 'netbeui.pcap'

[router]
default_zone = 'EtherTalk Network'
members = ['EtherTalk', 'LToUDP', 'TashTalk']

[[smbshares]]
name = 'Foo'
description = 'Test share'
fs_type = 'local_fs'
path = 'C:\mac\food'
