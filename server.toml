[AFP]
enabled = true
server_name = 'ClassicStack'
zone = 'EtherTalk Network'
transports = ['ddp']
login_message = 'Welcome to ClassicStack - enjoy your stay.'

[Client]
enabled = true
iface = 'br-lan'
services = ['afp', 'smb', 'ncp', 'etherdfs']
max_idle_minutes = 10
mount = true
log_file = 'client.log'
capture = 'client-afp.pcap'

[EtherDFS]
enabled = false
capture = 'etherdfs.pcap'

[FUSE]
mount_timeout_seconds = 30

[IPXGW]
enabled = true
ipx_network = 3
bindings = ['ClassicStackIPXGW:EtherTalk Network']

[MacIP]
enabled = true
mode = 'nat'
zone = 'EtherTalk Network'
gateway_ip = '192.168.100.1'
network = '192.168.100.0'
nameserver = '8.8.8.8'
broadcast = '192.168.100.255'
subnet_mask = '255.255.255.0'
interface = 'br-lan'
default_gateway = '192.168.0.1'

[NCP]
enabled = true
server_name = 'Netware'
description = 'Netware Test share'

[NetBIOS]
transports = ['netbeui', 'ipx']

[Netboot]
enabled = true
payload = './netboot/ChainDisk.bin'
block_size = 256
pace_ms = 2
chain_pace_ms = 10
name = '0000'
zone = '*'

[ProxyAARP]
enabled = false
tunnel_interface = ''
egress_interface = ''
egress_mac = ''

[SMB]
enabled = true
transports = ['netbeui', 'ipx', 'nbt', 'tcp']
tcp_addr = '::445'

[adminauth]
user = 'admin'
salt = '0023bfac16cdcddbbcbcae1779d9fa18'
hash = 'ff05b74ea38440edef8ea1d7034f118b6fe706bce44ef37e1a9c0c1728b2a74c'

[[afpvolumes]]
name = 'Test Volume'
fs_type = 'local_fs'
path = './dist/Sample Volume'
size_limit = 50000

[[etherdfsdrives]]
name = 'C'
fs_type = 'local_fs'
path = './dist/Sample Volume'

[[ethertalk]]
iface = 'br-lan'
enabled = true
seed_network = 3
seed_network_end = 5
seed_zone = 'EtherTalk Network'
capture = 'ethertalk.pcap'

[http]
enabled = true
addr = ':1984'

[identity]
hostname = 'classicstack'
workgroup = 'WORKGROUP'
description = 'ClassicStack file server'

[[interface]]
name = 'br-lan'
kind = 'bridge'
default = true
backend = 'pcap'
device = 'en5'

[[ipx]]
iface = 'br-lan'
enabled = true
ipx_frame_type = 'ethernet_ii'
ipx_frame_types = ['ethernet_ii', '802.3', '802.2']
capture = 'ipx.pcap'

[logging]
level = 'debug'
path = 'classicstack.log'

[[ltoudp]]
enabled = true
seed_network = 1
seed_network_end = 1
seed_zone = 'LToUDP Network'
capture = 'ltoudp-netboot.pcap'
pace_ms = 5

[[ncpvolumes]]
name = 'Netware'
fs_type = 'local_fs'
path = './dist/Sample Volume'

[[netbeui]]
iface = 'br-lan'
enabled = true
capture = 'netbeui.pcap'

[router]
default_zone = 'EtherTalk Network'
members = ['EtherTalk', 'LToUDP', 'TashTalk']

[[smbshares]]
name = 'SMB_Share'
description = 'Test share'
fs_type = 'local_fs'
path = './dist/Sample Volume'

[[tashtalk]]
enabled = true
device = '/dev/tty.usbserial-1140'
baud = 1000000
seed_network = 2
seed_zone = 'TashTalk Network'
capture = 'tashtalk.pcap'
