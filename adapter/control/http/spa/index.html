<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassicStack</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header>
    <h1>ClassicStack</h1>
    <nav id="tabs" class="hidden">
      <button class="tab active" data-tab="dashboard">Dashboard</button>
      <button class="tab" data-tab="interfaces">Interfaces</button>
      <button class="tab" data-tab="router">AppleTalk Router</button>
      <button class="tab" data-tab="protocols">Protocols</button>
      <button class="tab" data-tab="sharing">Sharing</button>
      <button class="tab" data-tab="users">Users</button>
      <button class="tab" data-tab="diagnostics">Diagnostics</button>
      <button class="tab" data-tab="logs">Logs</button>
    </nav>
    <span id="conn" class="badge">…</span>
  </header>

  <!-- cs-app is the root custom element. It probes the first-run gate and either
       shows the setup form or mounts the tabbed admin shell. No framework. -->
  <cs-app></cs-app>

  <script src="app.js" type="module"></script>
</body>
</html>
