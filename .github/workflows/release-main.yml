name: Release On Main

# Only ever runs from a version tag (vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rcN,
# e.g. v1.0.0-rc1) -- pushing to main no longer auto-cuts a "dev-<sha>" prerelease.
# scripts/ci/compute-release-metadata.sh enforces this too (fails closed if the
# triggering ref isn't a matching tag), so a workflow_dispatch run picked from a
# branch fails fast rather than publishing a release. PR builds still produce
# downloadable workflow artifacts (see pr-ci.yml) without needing a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Compute Release Metadata
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      build_version: ${{ steps.meta.outputs.build_version }}
      build_date: ${{ steps.meta.outputs.build_date }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      major: ${{ steps.meta.outputs.major }}
      minor: ${{ steps.meta.outputs.minor }}
      patch: ${{ steps.meta.outputs.patch }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          while IFS= read -r line; do
            echo "$line" >> "$GITHUB_OUTPUT"
          done < <(bash scripts/ci/compute-release-metadata.sh)

  build:
    name: Build And Package (${{ matrix.os }} / ${{ matrix.variant }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux - all
          - os: ubuntu-latest
            variant: all
            artifact_name: classicstack-linux
            archive_name: classicstack-${{ needs.version.outputs.release_tag }}-linux-amd64.tar.gz
            build_script: bash scripts/ci/build.sh
            package_script: bash scripts/ci/package-release.sh
            target_os: linux
            output: out/classicstack
          # Linux - router
          - os: ubuntu-latest
            variant: router
            artifact_name: classicstack-router-linux
            archive_name: classicstack-router-${{ needs.version.outputs.release_tag }}-linux-amd64.tar.gz
            build_script: bash scripts/ci/build.sh
            package_script: bash scripts/ci/package-release.sh
            target_os: linux
            output: out/classicstack-router
          # macOS - all
          - os: macos-latest
            variant: all
            artifact_name: classicstack-macos
            archive_name: classicstack-${{ needs.version.outputs.release_tag }}-macos-amd64.zip
            build_script: bash scripts/ci/build.sh
            package_script: bash scripts/ci/package-release.sh
            target_os: macos
            output: out/classicstack
          # macOS - router
          - os: macos-latest
            variant: router
            artifact_name: classicstack-router-macos
            archive_name: classicstack-router-${{ needs.version.outputs.release_tag }}-macos-amd64.zip
            build_script: bash scripts/ci/build.sh
            package_script: bash scripts/ci/package-release.sh
            target_os: macos
            output: out/classicstack-router
          # Windows - all
          - os: windows-latest
            variant: all
            artifact_name: classicstack-windows
            archive_name: classicstack-${{ needs.version.outputs.release_tag }}-windows-amd64.zip
            build_script: ./scripts/ci/build.ps1
            package_script: ./scripts/ci/package-release.ps1
            target_os: windows
            output: out/classicstack.exe
          # Windows - router
          - os: windows-latest
            variant: router
            artifact_name: classicstack-router-windows
            archive_name: classicstack-router-${{ needs.version.outputs.release_tag }}-windows-amd64.zip
            build_script: ./scripts/ci/build.ps1
            package_script: ./scripts/ci/package-release.ps1
            target_os: windows
            output: out/classicstack-router.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install libpcap headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev

      - name: Setup SPA
        if: matrix.variant == 'all'
        uses: ./.github/actions/setup-spa

      - name: Build binary (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BUILD_COMMIT: ${{ needs.version.outputs.commit_sha }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
          BUILD_VARIANT: ${{ matrix.variant }}
          OUTPUT: ${{ matrix.output }}
        run: ${{ matrix.build_script }}

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BUILD_COMMIT: ${{ needs.version.outputs.commit_sha }}
          BUILD_DATE: ${{ needs.version.outputs.build_date }}
          BUILD_VARIANT: ${{ matrix.variant }}
          OUTPUT: ${{ matrix.output }}
        run: ${{ matrix.build_script }}

      - name: Package release (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET_OS: ${{ matrix.target_os }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BUILD_VARIANT: ${{ matrix.variant }}
        run: ${{ matrix.package_script }}

      - name: Package release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET_OS: ${{ matrix.target_os }}
          RELEASE_TAG: ${{ needs.version.outputs.release_tag }}
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          BUILD_VARIANT: ${{ matrix.variant }}
        run: ${{ matrix.package_script }}

  installer-windows:
    name: Build Windows Installer (ISCC)
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup SPA
        uses: ./.github/actions/setup-spa

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            throw "ISCC.exe not found on PATH after installing Inno Setup"
          }

      - name: Build installer (bin + ISCC)
        shell: pwsh
        run: pwsh packaging/windows/build.ps1 -Version ${{ needs.version.outputs.build_version }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-windows-installer
          path: packaging/windows/Output/ClassicStack-Setup-*.exe
          if-no-files-found: error

  build-embedded:
    name: Build And Package Embedded (TinyGo)
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup TinyGo
        uses: acifani/setup-tinygo@v2
        with:
          # 0.41.0 cannot assemble a goroot from a Go 1.26 stdlib — see
          # refactor-harness.yml's TinyGo amd64 gates job, fixed there first.
          tinygo-version: "0.41.1"

      - name: Build WT32-ETH01
        run: bash scripts/build_wt32eth01.sh

      - name: Build Pico
        run: bash scripts/build_pico.sh pico

      - name: Build Pico W
        run: bash scripts/build_pico.sh picow

      - name: Build Pico 2
        run: bash scripts/build_pico.sh pico2

      - name: Build Pico 2 W
        run: bash scripts/build_pico.sh pico2w

      - name: Package Release Artifacts
        shell: bash
        run: |
          # Package WT32-ETH01
          zip -j classicstack-${{ needs.version.outputs.release_tag }}-wt32eth01.zip bin/classicstack-wt32eth01.bin
          # Package Pico
          zip -j classicstack-${{ needs.version.outputs.release_tag }}-pico.zip bin/classicstack-pico.uf2
          zip -j classicstack-${{ needs.version.outputs.release_tag }}-picow.zip bin/classicstack-picow.uf2
          zip -j classicstack-${{ needs.version.outputs.release_tag }}-pico2.zip bin/classicstack-pico2.uf2
          zip -j classicstack-${{ needs.version.outputs.release_tag }}-pico2w.zip bin/classicstack-pico2w.uf2

      - name: Upload WT32-ETH01
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-wt32eth01
          path: classicstack-${{ needs.version.outputs.release_tag }}-wt32eth01.zip

      - name: Upload Pico
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-pico
          path: classicstack-${{ needs.version.outputs.release_tag }}-pico.zip

      - name: Upload Pico W
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-picow
          path: classicstack-${{ needs.version.outputs.release_tag }}-picow.zip

      - name: Upload Pico 2
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-pico2
          path: classicstack-${{ needs.version.outputs.release_tag }}-pico2.zip

      - name: Upload Pico 2 W
        uses: actions/upload-artifact@v4
        with:
          name: classicstack-pico2w
          path: classicstack-${{ needs.version.outputs.release_tag }}-pico2w.zip

  release:
    name: Publish GitHub Release
    needs:
      - version
      - build
      - build-embedded
      - installer-windows
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.release_tag }}
          name: ${{ needs.version.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/**/*.zip
            release-artifacts/**/*.tar.gz
            release-artifacts/**/*.exe
