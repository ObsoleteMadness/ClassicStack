# ClassicStack — starter config for the macOS menu bar app (ClassicStack.app).
#
# A missing/empty config already boots fine on ClassicStack's built-in
# defaults (every compiled-in service starts, just with zero shares) — this
# template only adds three example shares so a fresh install has something to
# actually connect to. The placeholder token below (see launcher.go) is
# substituted by classicstack-tray at first run with the real path to the
# copy of this bundle's Volumes folder it provisions under
# ~/Library/Application Support/ClassicStack/Volumes.
#
# Edit or remove any of this from the web admin UI (Open Interface in the
# menu bar), or by hand here — see server.toml.example in this bundle's
# Resources folder for the full set of sections/options.

[[afpvolumes]]
name = "Public"
fs_type = "local_fs"
path = "__VOLUMES__/Public"
read_only = false

[[smbshares]]
name = "public"
description = "Public share"
fs_type = "local_fs"
path = "__VOLUMES__/Public"
read_only = false

[[ncpvolumes]]
name = "SYS"
fs_type = "local_fs"
path = "__VOLUMES__/SYS"
read_only = false

[[etherdfsdrives]]
name = "E"
fs_type = "local_fs"
path = "__VOLUMES__/DOS"
read_only = false
